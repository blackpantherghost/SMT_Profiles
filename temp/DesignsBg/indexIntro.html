<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome Friends! CGI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        body {
            background: #000;
        }
        canvas {
            display: block;
            cursor: crosshair;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <script>
        class RetroCGI {
            constructor() {
                this.canvas = document.getElementById('canvas');
                this.ctx = this.canvas.getContext('2d');
                this.particles = [];
                this.mouse = { x: null, y: null };
                this.colors = ['#00FFFF', '#FF00FF', '#00FF00', '#FFFFFF'];
                this.particleCount = 120;
                this.connectionDistance = 140;
                this.mouseConnectionDistance = 200;
                this.scanlineOffset = 0;
                
                this.init();
                this.setupEventListeners();
                this.animate();
            }
            
            init() {
                this.resize();
                this.createParticles();
            }
            
            resize() {
                this.canvas.width = window.innerWidth;
                this.canvas.height = window.innerHeight;
            }
            
            setupEventListeners() {
                window.addEventListener('resize', () => this.resize());
                
                this.canvas.addEventListener('mousemove', (e) => {
                    this.mouse.x = e.clientX;
                    this.mouse.y = e.clientY;
                });
                
                this.canvas.addEventListener('mouseleave', () => {
                    this.mouse.x = null;
                    this.mouse.y = null;
                });
            }
            
            createParticles() {
                this.particles = [];
                for (let i = 0; i < this.particleCount; i++) {
                    this.particles.push({
                        x: Math.random() * this.canvas.width,
                        y: Math.random() * this.canvas.height,
                        vx: (Math.random() - 0.5) * 0.5,
                        vy: (Math.random() - 0.5) * 0.5,
                        color: this.colors[Math.floor(Math.random() * this.colors.length)],
                        radius: Math.random() * 2 + 1
                    });
                }
            }
            
            drawGrain() {
                if (this.canvas.width === 0 || this.canvas.height === 0) return;
                
                const imageData = this.ctx.getImageData(0, 0, this.canvas.width, this.canvas.height);
                const pixels = imageData.data;
                
                for (let i = 0; i < pixels.length; i += 4) {
                    if (Math.random() < 0.015) {
                        const grain = Math.random() * 30;
                        pixels[i] += grain;
                        pixels[i + 1] += grain;
                        pixels[i + 2] += grain;
                    }
                }
                
                this.ctx.putImageData(imageData, 0, 0);
            }
            
            updateParticles() {
                for (let particle of this.particles) {
                    particle.x += particle.vx;
                    particle.y += particle.vy;
                    
                    // Mouse repulsion
                    if (this.mouse.x !== null && this.mouse.y !== null) {
                        const dx = particle.x - this.mouse.x;
                        const dy = particle.y - this.mouse.y;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        
                        if (dist < 100) {
                            const force = (100 - dist) / 100;
                            particle.x += (dx / dist) * force * 2;
                            particle.y += (dy / dist) * force * 2;
                        }
                    }
                    
                    // Wrap around edges
                    if (particle.x < 0) particle.x = this.canvas.width;
                    if (particle.x > this.canvas.width) particle.x = 0;
                    if (particle.y < 0) particle.y = this.canvas.height;
                    if (particle.y > this.canvas.height) particle.y = 0;
                }
            }
            
            drawParticles() {
                for (let particle of this.particles) {
                    this.ctx.save();
                    this.ctx.shadowBlur = 10;
                    this.ctx.shadowColor = particle.color;
                    this.ctx.fillStyle = particle.color;
                    this.ctx.beginPath();
                    this.ctx.arc(particle.x, particle.y, particle.radius, 0, Math.PI * 2);
                    this.ctx.fill();
                    this.ctx.restore();
                }
            }
            
            drawConnections() {
                for (let i = 0; i < this.particles.length; i++) {
                    for (let j = i + 1; j < this.particles.length; j++) {
                        const dx = this.particles[i].x - this.particles[j].x;
                        const dy = this.particles[i].y - this.particles[j].y;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        
                        if (dist < this.connectionDistance) {
                            const opacity = 1 - (dist / this.connectionDistance);
                            this.ctx.strokeStyle = `rgba(0, 255, 255, ${opacity * 0.3})`;
                            this.ctx.lineWidth = 0.5;
                            this.ctx.beginPath();
                            this.ctx.moveTo(this.particles[i].x, this.particles[i].y);
                            this.ctx.lineTo(this.particles[j].x, this.particles[j].y);
                            this.ctx.stroke();
                        }
                    }
                }
            }
            
            drawMouseConnections() {
                if (this.mouse.x === null || this.mouse.y === null) return;
                
                for (let particle of this.particles) {
                    const dx = particle.x - this.mouse.x;
                    const dy = particle.y - this.mouse.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    
                    if (dist < this.mouseConnectionDistance) {
                        const opacity = 1 - (dist / this.mouseConnectionDistance);
                        this.ctx.strokeStyle = `rgba(255, 0, 255, ${opacity * 0.5})`;
                        this.ctx.lineWidth = 1;
                        this.ctx.beginPath();
                        this.ctx.moveTo(this.mouse.x, this.mouse.y);
                        this.ctx.lineTo(particle.x, particle.y);
                        this.ctx.stroke();
                    }
                }
            }
            
            drawText() {
                const centerX = this.canvas.width / 2;
                const centerY = this.canvas.height / 2;
                const fontSize = Math.min(this.canvas.width / 10, 80);
                
                this.ctx.font = `bold ${fontSize}px Arial, sans-serif`;
                this.ctx.textAlign = 'center';
                this.ctx.textBaseline = 'middle';
                
                // Chromatic aberration effect
                const offset = 2;
                
                // Red channel
                this.ctx.fillStyle = 'rgba(255, 0, 0, 0.7)';
                this.ctx.fillText('Welcome', centerX - offset, centerY - fontSize * 1.3);
                this.ctx.fillText('Friends!', centerX - offset, centerY - fontSize * 0.3);
                
                // Green channel
                this.ctx.fillStyle = 'rgba(0, 255, 0, 0.7)';
                this.ctx.fillText('Welcome', centerX, centerY - fontSize * 1.3 + offset);
                this.ctx.fillText('Friends!', centerX, centerY - fontSize * 0.3 + offset);
                
                // Blue channel
                this.ctx.fillStyle = 'rgba(0, 0, 255, 0.7)';
                this.ctx.fillText('Welcome', centerX + offset, centerY - fontSize * 1.3);
                this.ctx.fillText('Friends!', centerX + offset, centerY - fontSize * 0.3);
                
                // Main text with striped effect
                const gradient = this.ctx.createLinearGradient(
                    centerX - 200, 0, centerX + 200, 0
                );
                gradient.addColorStop(0, '#00FFFF');
                gradient.addColorStop(0.33, '#FFFFFF');
                gradient.addColorStop(0.66, '#FF00FF');
                gradient.addColorStop(1, '#00FFFF');
                
                this.ctx.strokeStyle = gradient;
                this.ctx.lineWidth = 3;
                this.ctx.strokeText('Welcome', centerX, centerY - fontSize * 1.3);
                this.ctx.strokeText('Friends!', centerX, centerY - fontSize * 0.3);
                
                this.ctx.fillStyle = '#000000';
                this.ctx.fillText('Welcome', centerX, centerY - fontSize * 1.3);
                this.ctx.fillText('Friends!', centerX, centerY - fontSize * 0.3);
                
                // CGI text
                this.ctx.font = `bold ${fontSize * 1.5}px Arial, sans-serif`;
                
                // Chromatic aberration for CGI
                this.ctx.fillStyle = 'rgba(255, 0, 0, 0.7)';
                this.ctx.fillText('CGI', centerX - offset, centerY + fontSize * 0.8);
                
                this.ctx.fillStyle = 'rgba(0, 255, 0, 0.7)';
                this.ctx.fillText('CGI', centerX, centerY + fontSize * 0.8 + offset);
                
                this.ctx.fillStyle = 'rgba(0, 0, 255, 0.7)';
                this.ctx.fillText('CGI', centerX + offset, centerY + fontSize * 0.8);
                
                this.ctx.strokeStyle = gradient;
                this.ctx.lineWidth = 4;
                this.ctx.strokeText('CGI', centerX, centerY + fontSize * 0.8);
                
                this.ctx.fillStyle = '#000000';
                this.ctx.fillText('CGI', centerX, centerY + fontSize * 0.8);
                
                // Scanline effect
                this.drawScanlines();
            }
            
            drawScanlines() {
                this.scanlineOffset += 0.5;
                if (this.scanlineOffset > 4) this.scanlineOffset = 0;
                
                this.ctx.fillStyle = 'rgba(255, 255, 255, 0.02)';
                for (let i = this.scanlineOffset; i < this.canvas.height; i += 4) {
                    this.ctx.fillRect(0, i, this.canvas.width, 1);
                }
            }
            
            animate() {
                this.ctx.fillStyle = '#000000';
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
                
                this.updateParticles();
                this.drawConnections();
                this.drawMouseConnections();
                this.drawParticles();
                this.drawText();
                this.drawGrain();
                
                requestAnimationFrame(() => this.animate());
            }
        }
        
        new RetroCGI();
    </script>
</body>
</html>
